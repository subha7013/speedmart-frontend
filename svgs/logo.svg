<svg xmlns="http://www.w3.org/2000/svg" width="500" height="150" viewBox="0 0 500 150">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0072ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <g transform="translate(20, 35) skewX(-10)">
    <path d="M10 40 L50 0 L45 35 L80 35 L30 80 L35 45 Z" fill="url(#brand-grad)" />
    <rect x="0" y="35" width="5" height="10" fill="url(#brand-grad)" opacity="0.4" />
    <rect x="-10" y="35" width="5" height="10" fill="url(#brand-grad)" opacity="0.2" />
  </g>

  <g font-family="Segoe UI, Montserrat, Arial, sans-serif" font-style="italic">
    <text x="110" y="75" font-weight="900" font-size="48" fill="#1a1a1a">
      SPEED<tspan fill="url(#brand-grad)">MART</tspan>
    </text>
    
    <text x="112" y="105" font-size="14" font-weight="600" fill="#666" letter-spacing="1">
      GADGETS AT LIGHTNING SPEED
    </text>
  </g>
  
  <rect x="112" y="115" width="240" height="2" fill="url(#brand-grad)" rx="1" />
</svg>
